# ReviewMap accounts.
#
# Copy this file to config.conf (which is gitignored) and edit it:
#
#     cp config.example.conf config.conf
#     chmod 600 config.conf
#
# One line per person:
#
#     name: password, role
#
# Roles
#   admin     can delete any marker and any review, on top of everything a
#             reviewer can do
#   reviewer  can add markers and reviews, and delete the reviews they wrote
#
# Anyone who does not log in is a guest and can only read the map.
#
# The password on its own identifies the person, so no two people may share
# one. The name is what shows up on their reviews.
#
# Notes
#   - Only whole lines can be comments, so a password may contain # or ; .
#   - The name is split off at the first ":" and the role at the last ",", so
#     a password may contain both of those too.
#   - Edits are picked up within a second; the server does not need a restart.
#     Changing a role takes effect immediately for anyone already logged in.
#     Renaming a person logs them out, because the old name no longer resolves.
#   - Passwords are stored here in plain text, which is why the file is
#     gitignored and should not be world-readable.

[accounts]
Ahrirg: change-me-admin, admin
Jonas:  change-me-jonas, reviewer

[options]
# How long a login is remembered on the same browser, in days.
session_days: 30
